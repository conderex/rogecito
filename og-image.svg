  <g font-family="DejaVu Sans" font-weight="bold">
    <text x="470" y="258" font-size="92" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2" letter-spacing="-1">DoingThe</text>
    <text x="470" y="350" font-size="92" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2" letter-spacing="-1">Doings</text>
