function renderWeekNav(){
  const dates = weekDates(state.weekOffset);
  const a = dates[0], b = dates[6];
  const range = `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}`;
  let label;
  if(state.weekOffset === 0)       label = tr('this_week');
  else if(state.weekOffset === -1) label = tr('last_week');
  else if(state.weekOffset === 1)  label = tr('next_week_lbl');
  else label = (state.weekOffset<0 ? tr('weeks_ago', Math.abs(state.weekOffset)) : tr('weeks_ahead', state.weekOffset));

  document.getElementById('weekLabel').firstChild.textContent = label;
  document.getElementById('weekRange').textContent = weekIsLocked(state.weekOffset) ? range + ' · 🔒 ' + tr('read_only') : range;
  const tb = document.getElementById('todayBtn');
  tb.toggleAttribute('disabled', state.weekOffset === 0);
}

function renderCards(){
  const dates = weekDates(state.weekOffset);
  const isoDates = dates.map(iso);
  const todayIso = iso(startOfToday());
  const cards = document.getElementById('cards');
  cards.innerHTML = '';

  const tabs = activeTablitas();
  if(tabs.length === 0){
    cards.innerHTML = '<p class="empty-note">' + tr('no_tables') + '</p>';
    return;
  }
  tabs.forEach(tab => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--accent', tab.accent);

    // header
    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = `<h2>${esc(tab.title)}</h2>`;
    const badge = document.createElement('span');
    badge.className = 'streak';
    badge.id = 'streak-' + tab.id;
    badge.setAttribute('role','button');
    badge.setAttribute('tabindex','0');
    badge.setAttribute('aria-label', tr('streak_tips_title'));
    badge.addEventListener('click', openStreakTips);
    badge.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openStreakTips(); } });
    head.appendChild(badge);
    card.appendChild(head);

    const sinfo = computeStreaks(tab.id);

    // grid
    const grid = document.createElement('div');
    grid.className = 'grid';

    // day-header row
    grid.appendChild(el('div','corner'));
    DAY_HEADERS.forEach((h,i)=>{
      const dh = el('div','dayhead');
      if(isoDates[i] === todayIso) dh.classList.add('today');
      dh.innerHTML = `${h}<span class="dot"></span>`;
      grid.appendChild(dh);
    });

    // sub-activity rows
    tab.subActivities.forEach(sub => {
      grid.appendChild(el('div','rowlabel', sub.label));
      isoDates.forEach(d => {
        const cell = document.createElement('button');
        cell.className = 'cell';
        cell.dataset.d = d;
        cell.setAttribute('aria-label', `${tab.title} · ${sub.label} · ${d}`);
        const isChecked = state.checks.has(key(tab.id, sub.id, d));
        if(isChecked) cell.classList.add('checked');
        const locked = isLocked(d);
        if(locked){ cell.classList.add('locked'); cell.setAttribute('aria-disabled','true'); }
        // Forgiven past day: the empty circle wears the flower isotype instead of a gap.
        // (Today stays plain — it can still be marked.) The .fill paints on top when checked.
        const patched = !isChecked && sinfo.bridged.has(d);
        if(patched) cell.classList.add('patched');
        cell.innerHTML = '<span class="bar">' + (patched ? FLOWER_SVG('bloom') : '') + '<span class="fill"></span></span>';
        cell.addEventListener('click', ()=> {
          if(locked){ showToast(tr('locked_toast')); return; }
          toggle(tab.id, sub.id, d, cell);
        });
        grid.appendChild(cell);
      });
    });

    card.appendChild(grid);
    card.dataset.tid = tab.id;
    cards.appendChild(card);

    paintStreak(tab.id, false);
  });
}

function paintStreak(tablitaId, animate){
  const badge = document.getElementById('streak-'+tablitaId);
  if(!badge) return;
  const { current, held } = computeStreaks(tablitaId);
  badge.innerHTML = `<span class="flame">🔥</span><span class="num">${current}</span>` +
    (held ? FLOWER_SVG('patch') : '');
  const prev = state.prevStreaks[tablitaId] || 0;
  if(animate && current > prev){
    badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop');
  }
  state.prevStreaks[tablitaId] = current;
}
function refreshStreak(tablitaId){
  paintStreak(tablitaId, true);
  paintPatches(tablitaId);
  if(state.tab === 'insights') renderInsights();
}
// Which days are forgiven changes every time a cell is toggled, so the ✿ has to
// be re-evaluated too — in place, so the cell that was just tapped keeps its
// fill animation instead of being rebuilt.
function paintPatches(tablitaId){
  // Match on the property, not a built selector: tablita ids come from the DB and
  // would otherwise need escaping (and CSS.escape is not everywhere).
  const card = [...document.querySelectorAll('#cards .card')].find(c => c.dataset.tid === tablitaId);
  if(!card) return;
  const bridged = computeStreaks(tablitaId).bridged;
  card.querySelectorAll('.cell').forEach(cell => {
    const want = !cell.classList.contains('checked') && bridged.has(cell.dataset.d);
    if(want === cell.classList.contains('patched')) return;
    cell.classList.toggle('patched', want);
    const bar = cell.querySelector('.bar');
    const bloom = bar.querySelector('.bloom');
    if(want && !bloom) bar.insertAdjacentHTML('afterbegin', FLOWER_SVG('bloom'));
    else if(!want && bloom) bloom.remove();
  });
}

/* =====================================================================
   COUNTERS  (tally per day)
   Stored in the same checks table under tablita='conteo'. Each tap = one
   row with a unique sub_activity ("stogies#<token>") so the day's count is
   just the number of matching rows — no schema change, fallback works the
   same. Increment inserts a row; decrement deletes the most recent one.
   ===================================================================== */
const COUNTER_TABLITA = 'conteo';
function counterKeys(itemId, d){
  const pre = COUNTER_TABLITA + '|' + itemId + '#';
  const suf = '|' + d;
  const out = [];
  for(const k of state.checks){ if(k.startsWith(pre) && k.endsWith(suf)) out.push(k); }
  return out;
}
const counterCount = (itemId, d) => counterKeys(itemId, d).length;

async function counterInc(itemId){
  const d = iso(startOfToday());
  const sub = itemId + '#' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const k = key(COUNTER_TABLITA, sub, d);
  state.checks.add(k); saveLocal(); paintCounter(itemId);
  if(state.tab === 'insights') renderInsights();
  if(state.mode !== 'supabase') return;
  try{ await sbInsert(COUNTER_TABLITA, sub, d); }
  catch(e){
    state.checks.delete(k); saveLocal(); paintCounter(itemId);
    state.mode = 'local'; updateModePill(); showToast(tr('offline_local'));
  }
}
async function counterDec(itemId){
  const d = iso(startOfToday());
  const keys = counterKeys(itemId, d);
  if(keys.length === 0) return;
  const k = keys[keys.length - 1];
  const sub = k.split('|')[1];
  state.checks.delete(k); saveLocal(); paintCounter(itemId);
  if(state.tab === 'insights') renderInsights();
  if(state.mode !== 'supabase') return;
  try{ await sbDelete(COUNTER_TABLITA, sub, d); }
  catch(e){
    state.checks.add(k); saveLocal(); paintCounter(itemId);
    state.mode = 'local'; updateModePill(); showToast(tr('offline_local'));
  }
}

function renderCounters(){
  const wrap = document.getElementById('counters');
  wrap.innerHTML = '';
  const list = activeCounters();
  document.getElementById('countTitle').style.display = list.length ? '' : 'none';
  list.forEach(c => {
    const d = iso(startOfToday());
    const n = counterCount(c.id, d);
    state.prevCounts[c.id] = n;
    const box = document.createElement('div');
    box.className = 'counter';
    box.style.setProperty('--accent', c.accent);
    box.innerHTML = `
      <div class="c-top"><span class="c-emoji">${esc(c.emoji)}</span><span class="c-name">${esc(c.label)}</span></div>
      <div class="c-controls">
        <button class="cbtn minus" aria-label="${esc(tr('cnt_minus', c.label))}" ${n===0?'disabled':''}>−</button>
        <span class="count" id="count-${c.id}">${n}</span>
        <button class="cbtn plus" aria-label="${esc(tr('cnt_plus', c.label))}">+</button>
      </div>`;
    box.querySelector('.plus').addEventListener('click', ()=> counterInc(c.id));
    box.querySelector('.minus').addEventListener('click', ()=> counterDec(c.id));
    wrap.appendChild(box);
  });
}

function paintCounter(itemId){
  const n = counterCount(itemId, iso(startOfToday()));
  const el = document.getElementById('count-' + itemId);
  if(!el) return;
  el.textContent = n;
  if(n > (state.prevCounts[itemId] || 0)){
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
  state.prevCounts[itemId] = n;
  // toggle the minus button disabled state
  const minus = el.parentElement.querySelector('.minus');
  if(minus) minus.toggleAttribute('disabled', n === 0);
}

/* =====================================================================
   RENDER — INSIGHTS  (current displayed week)
   ===================================================================== */
// Tablita constancia period: 'week' | 'month' | 'quarter' | 'year'.
let insTabPeriod = 'week';

// Whole days from aISO to bISO inclusive (both 'YYYY-MM-DD').
function daysBetween(aISO, bISO){
  return Math.round((new Date(bISO+'T00:00:00') - new Date(aISO+'T00:00:00')) / 86400000);
}

// Completion buckets for a tablita over the selected period.
// week/month -> one bucket per day (bar chart); quarter/year -> per week/month (line).
// Each bucket pct = filled checks / (nSubs * elapsed days), bounded 0..100.
function tablitaConsData(t, period){
  const subs = new Set(t.subActivities.map(s=>s.id));
  const nSubs = subs.size;
  const perDay = new Map();
  for(const k of state.checks){
    const i1 = k.indexOf('|'); if(k.slice(0, i1) !== t.id) continue;
    const i2 = k.indexOf('|', i1 + 1);
    if(!subs.has(k.slice(i1 + 1, i2))) continue;       // archived/removed sub
    const d = k.slice(-10); perDay.set(d, (perDay.get(d) || 0) + 1);
  }
  const today = startOfToday(), tISO = iso(today);
  const filledIn = (a, b) => { let s = 0; for(const [d, n] of perDay){ if(d >= a && d <= b) s += n; } return s; };
  const elapsedIn = (a, b) => {                          // non-future days in [a,b]
    if(a > tISO) return 0;
    return daysBetween(a, b < tISO ? b : tISO) + 1;
  };
  const mk = (a, b, label) => {
    const filled = filledIn(a, b), possible = nSubs * elapsedIn(a, b);
    return { label, filled, possible, future: a > tISO,
             pct: possible > 0 ? Math.min(100, Math.round(filled / possible * 100)) : 0 };
  };

  let type = 'bar', buckets = [];
  if(period === 'week'){
    const ws = weekStart(today);
    for(let i = 0; i < 7; i++){ const d = iso(addDays(ws, i)); buckets.push(mk(d, d, DAY_HEADERS[i])); }
  } else if(period === 'month'){
    type = 'line';
    const y = today.getFullYear(), mo = today.getMonth(), dim = new Date(y, mo+1, 0).getDate();
    for(let i = 1; i <= dim; i++){ const d = iso(new Date(y, mo, i)); buckets.push(mk(d, d, (i === 1 || i % 5 === 0) ? String(i) : '')); }
  } else {                                               // year
    type = 'line';
    const y = today.getFullYear();
    for(let m = 0; m < 12; m++){ buckets.push(mk(iso(new Date(y, m, 1)), iso(new Date(y, m+1, 0)), MONTHS[m])); }
  }
  let f = 0, p = 0; buckets.forEach(b => { f += b.filled; p += b.possible; });
  return { type, nSubs, buckets, total: { filled: f, possible: p, pct: p > 0 ? Math.min(100, Math.round(f / p * 100)) : 0 } };
}

// Vertical bars (week/month): height = pct; zero = stub, future = faint stub.
function consBars(buckets, accent){
  return `<div class="bars" style="--accent:${accent}">${buckets.map(b => {
    const cls = b.future ? 'bar future' : (b.pct <= 0 ? 'bar zero' : 'bar');
    const h = (b.future || b.pct <= 0) ? 0 : b.pct;
    return `<div class="${cls}"><span class="bfill" data-h="${h}" title="${esc((b.label||'') + ' · ' + b.filled + '/' + b.possible)}"></span><span class="blab">${esc(b.label || '')}</span></div>`;
  }).join('')}</div>`;
}

// Mini % line chart (quarter/year): plots non-future buckets only.
function consLine(buckets, accent){
  const W = 320, H = 120, padL = 8, padR = 8, padT = 10, padB = 18;
  const plotW = W - padL - padR, plotH = H - padT - padB, n = buckets.length;
  const xAt = i => n <= 1 ? padL + plotW/2 : padL + (i/(n-1))*plotW;
  const yAt = v => padT + plotH - (Math.max(0, Math.min(100, v))/100)*plotH;
  let grid = '';
  [0, 50, 100].forEach(v => { const y = yAt(v); grid += `<line class="cgrid" x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}"/>`; });
  const live = buckets.map((b, i) => ({ b, i })).filter(o => !o.b.future);
  let line = '';
  if(live.length > 1) line += `<polyline class="cline" data-line points="${live.map(o => xAt(o.i).toFixed(1)+','+yAt(o.b.pct).toFixed(1)).join(' ')}" stroke="${accent}"/>`;
  line += live.map(o => `<circle cx="${xAt(o.i).toFixed(1)}" cy="${yAt(o.b.pct).toFixed(1)}" r="3" fill="${accent}" stroke="var(--paper)" stroke-width="1.5"/>`).join('');
  const everyX = n > 8 ? 2 : 1;
  let xl = '';
  buckets.forEach((b, i) => { if((i % everyX !== 0 && i !== n-1) || !b.label) return; xl += `<text class="clab" x="${xAt(i).toFixed(1)}" y="${H-5}" text-anchor="middle">${esc(b.label)}</text>`; });
  return `<svg class="consline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${grid}${line}${xl}</svg>`;
}

// Month-over-month timeline for counters: monthly tap totals per active counter,
// from the first month with counter data up to the current month (last 12 max).
function counterMonthlyTimeline(){
  const cnts = activeCounters();
  const byId = {};
  cnts.forEach(c => byId[c.id] = new Map());
  const pre = COUNTER_TABLITA + '|';
  let minYM = null;
  for(const k of state.checks){
    if(!k.startsWith(pre)) continue;
    const hashPos = k.indexOf('#', pre.length);
    if(hashPos < 0) continue;
    const itemId = k.slice(pre.length, hashPos);
    const mp = byId[itemId];
    if(!mp) continue;                            // archived counter -> skip
    const ym = k.slice(-10, -3);
    if(minYM === null || ym < minYM) minYM = ym;
    mp.set(ym, (mp.get(ym) || 0) + 1);
  }
  const today = startOfToday();
  const curY = today.getFullYear(), curM = today.getMonth();
  let y = minYM ? +minYM.slice(0,4) : curY, m = minYM ? +minYM.slice(5,7)-1 : curM;
  const out = [];
  while(y < curY || (y === curY && m <= curM)){
    out.push({ ym: y + '-' + String(m+1).padStart(2,'0'), y, m });
    m++; if(m > 11){ m = 0; y++; }
  }
  const months = out.slice(-12);
  let prevY = null;
  months.forEach(b => {
    b.label = (b.y !== prevY) ? (MONTHS[b.m] + " '" + String(b.y).slice(2)) : MONTHS[b.m];
    prevY = b.y;
  });
  const series = cnts.map(c => ({
    label: (c.emoji ? c.emoji + ' ' : '') + c.label, accent: c.accent,
    values: months.map(b => byId[c.id].get(b.ym) || 0),
  }));
  return { months, series };
}

// Clean ceiling for a count axis (1/2/5 × 10^n).
function niceMax(maxVal){
  if(maxVal <= 0) return 5;
  const pow = Math.pow(10, Math.floor(Math.log10(maxVal)));
  const n = maxVal / pow;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return step * pow;
}

// Multi-series month timeline (one line per counter), styled like consLine.
function countsLine({ months, series, yMax }){
  const W = 320, H = 170, padL = 30, padR = 10, padT = 12, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB, n = months.length;
  const xAt = i => n <= 1 ? padL + plotW/2 : padL + (i/(n-1))*plotW;
  const yAt = v => padT + plotH - (Math.max(0, Math.min(yMax, v))/yMax)*plotH;
  let grid = '';
  [0, yMax/2, yMax].forEach(t => {
    const gy = yAt(t);
    grid += `<line class="cgrid" x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}"/>`;
    grid += `<text class="clab" x="${padL-5}" y="${(gy+3).toFixed(1)}" text-anchor="end">${Math.round(t)}</text>`;
  });
  const everyX = n > 8 ? 2 : 1;
  let xl = '';
  months.forEach((b, i) => {
    if(i % everyX !== 0 && i !== n-1) return;
    xl += `<text class="clab" x="${xAt(i).toFixed(1)}" y="${H-5}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  let lines = '';
  series.forEach(s => {
    const ac = safeAccent(s.accent);
    if(n > 1){
      lines += `<polyline class="cline" data-line points="${s.values.map((v,i)=>xAt(i).toFixed(1)+','+yAt(v).toFixed(1)).join(' ')}" stroke="${ac}"/>`;
    }
    s.values.forEach((v,i)=>{
      lines += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(v).toFixed(1)}" r="3" fill="${ac}" stroke="var(--paper)" stroke-width="1.5"/>`;
    });
  });
  return `<svg class="consline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${grid}${lines}${xl}</svg>`;
}

function renderInsights(){
  const wrap = document.getElementById('insights');
  wrap.innerHTML = '';
  const tabs = activeTablitas();
  const cnts = activeCounters();

  const intro = el('p','ins-intro',tr('ins_journey'));
  wrap.appendChild(intro);

  // (A) Constancia — per-tablita completion: bars (week/month) or line (quarter/year)
  if(tabs.length){
    const tabPeriods = [['week','ins_p_week'],['month','ins_p_month'],['year','ins_p_year']];
    const seg = tabPeriods.map(([p,k]) =>
      `<button type="button" class="segbtn${p===insTabPeriod?' on':''}" data-tp="${p}">${tr(k)}</button>`).join('');
    const blocks = tabs.map(t => {
      const d = tablitaConsData(t, insTabPeriod);
      const ac = safeAccent(t.accent);
      const chart = d.type === 'bar' ? consBars(d.buckets, ac) : consLine(d.buckets, ac);
      return `<div class="cons" style="--accent:${ac}">
        <div class="cons-head"><span class="cons-name">${esc(t.title)}</span><span class="cons-score">${d.total.pct}% <span class="cons-frac">${d.total.filled}/${d.total.possible}</span></span></div>
        ${chart}</div>`;
    }).join('');
    const card = el('div','ins-card');
    card.style.setProperty('--accent', 'var(--teal)');
    card.innerHTML = `
      <div class="ihead"><span class="swatch"></span><h3>${tr('ins_consistency')}</h3></div>
      <div class="seg">${seg}</div>
      ${blocks}
      <div class="top" style="margin-top:12px"><span class="k" style="font-size:.78rem">${tr('ins_consistency_sub')}</span></div>`;
    card.querySelectorAll('.segbtn').forEach(b => b.addEventListener('click', () => {
      if(insTabPeriod === b.dataset.tp) return;
      insTabPeriod = b.dataset.tp;
      renderInsights();
    }));
    wrap.appendChild(card);
  }

  // (B) Rachas máximas — compact pills (name · days · flame), in each accent
  if(tabs.length){
    const pills = tabs.map(t => {
      const longest = computeStreaks(t.id).longest;
      return `<span class="streak maxpill" role="button" tabindex="0" aria-label="${esc(tr('streak_tips_title'))}" style="--accent:${safeAccent(t.accent)}"><span class="mp-name">${esc(t.title)}</span><span class="num">${longest}</span><span class="flame">🔥</span></span>`;
    }).join('');
    const mc = el('div','ins-card');
    mc.style.setProperty('--accent', 'var(--orange)');
    mc.innerHTML = `
      <div class="ihead"><span class="swatch fire-swatch">🔥</span><h3>${tr('ins_streaks')}</h3></div>
      <div class="maxpills">${pills}</div>
      <div class="top" style="margin-top:10px"><span class="k" style="font-size:.78rem">${tr('ins_streaks_sub')}</span></div>`;
    mc.querySelectorAll('.maxpill').forEach(p => {
      p.addEventListener('click', openStreakTips);
      p.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openStreakTips(); } });
    });
    wrap.appendChild(mc);
  }

  // (B) Counters: month-over-month timeline — one line per counter
  if(cnts.length){
    const { months, series } = counterMonthlyTimeline();
    const rawMax = Math.max(0, ...series.flatMap(s => s.values));
    const legend = series.map(s =>
      `<span class="lg-item"><span class="lg-dot" style="background:${safeAccent(s.accent)}"></span>${esc(s.label)}</span>`).join('');
    const card = el('div','ins-card');
    card.style.setProperty('--accent', 'var(--gold)');
    card.innerHTML = `
      <div class="ihead"><span class="swatch fire-swatch">📊</span><h3>${tr('ins_counts')}</h3></div>
      ${countsLine({ months, series, yMax: niceMax(rawMax) })}
      <div class="legend">${legend}</div>
      <div class="top" style="margin-top:10px"><span class="k" style="font-size:.78rem">${tr('ins_counts_sub')}</span></div>`;
    wrap.appendChild(card);
  }

  // animate bars + draw the chart lines in, next frame
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    wrap.querySelectorAll('[data-w]').forEach(s => s.style.width = s.dataset.w + '%');
    wrap.querySelectorAll('[data-h]').forEach(s => s.style.height = s.dataset.h + '%');
    wrap.querySelectorAll('[data-line]').forEach(p => {
      try{
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        void p.getBoundingClientRect();
        p.style.transition = 'stroke-dashoffset 1s var(--ease-out)';
        p.style.strokeDashoffset = '0';
      }catch(e){}
    });
  }));
}

/* =====================================================================
   UI plumbing
   ===================================================================== */
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Accent colors are interpolated into inline style/SVG (not text), so esc() doesn't
// cover them. Whitelist to a safe CSS-variable shape; anything weird falls back. This
// neutralizes any tampered accent value (matters once therapists view patient data).
const ACCENT_RE = /^var\(--[a-z-]+\)$/;
const safeAccent = (a) => ACCENT_RE.test(a) ? a : 'var(--teal)';
// Brand flower isotype (5 round petals + hollow center) — drawn SVG, never an emoji,
// so it always renders in-palette. Used for streak patches.
const FLOWER_SVG = (cls) => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="12" cy="5" r="4.3"/><circle cx="18.5" cy="9.7" r="4.3"/><circle cx="16" cy="17.3" r="4.3"/><circle cx="8" cy="17.3" r="4.3"/><circle cx="5.5" cy="9.7" r="4.3"/></g><circle cx="12" cy="11.8" r="2.9" fill="var(--paper)"/></svg>`;
// Crescent moon isotype (same drawn family as the flower — never an emoji).
// Marks the Nocturno theme in the picker.
const MOON_SVG = (cls) => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.8 2.6a9.9 9.9 0 1 0 6.6 15.9A11.2 11.2 0 0 1 14.8 2.6z"/></svg>`;
const genId = (prefix) => prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const byOrder = (a,b) => a.sort_order - b.sort_order;

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2800);
}

function updateModePill(){
  const p = document.getElementById('modepill');
  const txt = document.getElementById('modepilltxt');
  p.classList.add('show');
  if(state.mode === 'supabase'){ p.classList.remove('local'); txt.textContent = 'sync'; }
  else { p.classList.add('local'); txt.textContent = 'local'; }
}

function switchTab(name){
  state.tab = name;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.getElementById('panel-tracker').classList.toggle('active', name==='tracker');
  document.getElementById('panel-insights').classList.toggle('active', name==='insights');
  document.getElementById('panel-stats').classList.toggle('active', name==='stats');
  document.getElementById('editToggle').style.display = name==='tracker' ? '' : 'none';
  if(name==='insights') renderInsights();
  if(name==='stats') renderStats();
}

function changeWeek(delta){
  state.weekOffset += delta;
  renderWeekNav(); renderCards();
  if(state.tab==='insights') renderInsights();
}

function bindUI(){
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', ()=> switchTab(b.dataset.tab)));
  document.getElementById('prevWeek').addEventListener('click', ()=> changeWeek(-1));
  document.getElementById('nextWeek').addEventListener('click', ()=> changeWeek(1));
  document.getElementById('todayBtn').addEventListener('click', ()=>{ if(state.weekOffset!==0){ state.weekOffset=0; renderWeekNav(); renderCards(); if(state.tab==='insights') renderInsights(); } });
  document.getElementById('editToggle').addEventListener('click', toggleEdit);

  // keep "today" accurate if the app is left open past midnight
  window.addEventListener('focus', ()=>{
    if(state.editing) return; // don't disturb an in-progress edit
    renderWeekNav(); renderCards(); renderCounters();
    if(state.tab==='insights') renderInsights();
  });
}

/* =====================================================================
   TABLE EDITOR  (add / rename / recolor / reorder / archive)
   All writes go to Supabase, then config is re-fetched for consistency.
   ===================================================================== */
function renderTrackerArea(){
  if(state.editing) renderEditor();
  else { renderWeekNav(); renderCards(); renderCounters(); }
}

function toggleEdit(){
  if(!state.editing && state.mode !== 'supabase'){
    showToast(tr('edit_tables_needs_conn'));
    return;
  }
  state.editing = !state.editing;
  const btn = document.getElementById('editToggle');
  btn.textContent = state.editing ? '✓' : '✎';
  btn.title = state.editing ? 'Listo' : 'Editar';
  btn.classList.toggle('on', state.editing);
  document.getElementById('panel-tracker').classList.toggle('editing', state.editing);
  renderTrackerArea();
}

function ebtn(glyph, label, disabled, onClick){
  const b = document.createElement('button');
  b.className = 'ebtn'; b.textContent = glyph; b.title = label; b.setAttribute('aria-label', label);
  if(disabled) b.disabled = true; else b.addEventListener('click', onClick);
  return b;
}
function tbtn(text, cls, onClick){
  const b = document.createElement('button');
  b.className = 'tbtn' + (cls ? ' '+cls : ''); b.textContent = text;
  b.addEventListener('click', onClick);
  return b;
}

// Permanently delete the signed-in user's account + data (double confirm).
async function deleteAccount(){
  if(!await confirmModal(tr('confirm_delete_1'), tr('delete_btn'))) return;
  if(!await confirmModal(tr('confirm_delete_2'), tr('delete_btn_final'))) return;
  try{
    const res = await fetch(REST_BASE + 'rpc/delete_user', {
      method:'POST',
      headers:{ ...authHeaders(), 'Content-Type':'application/json' },
      body:'{}',
    });
    if(!res.ok) throw new Error('delete HTTP '+res.status);
    // Wipe this device's local copy too (keep only the language preference).
    try{
      localStorage.removeItem(LS_KEY);
      localStorage.removeItem(LS_CONFIG);
      localStorage.removeItem(LS_COUNTERS);
    }catch(e){}
    state.checks = new Set(); state.config = []; state.counters = []; state.editing = false;
    showToast(tr('toast_deleted'));
    // The auth user no longer exists, so server-side signout can fail — ignore it
    // and drop the local session either way.
    try{ await sb.auth.signOut(); }
    catch(e){ try{ await sb.auth.signOut({ scope:'local' }); }catch(e2){} }
    handleSession(null);
  }catch(e){
    showToast(tr('msg_delete_failed'));
  }
}

// Run a config write, then re-sync from Supabase and re-render the editor.
async function withConfigWrite(fn){
  if(state.mode !== 'supabase'){ showToast(tr('edit_needs_conn')); return; }

    await fn();
    const [config, counters] = await Promise.all([ sbFetchConfig(), sbFetchCounters() ]);
    state.config = config; state.counters = counters;
    saveConfigLocal(); saveCountersLocal();
    renderEditor();
  }catch(e){ showToast(tr('save_failed')); }
}

/* =====================================================================
   MODALS  (text input + optional color picker, and confirm)
   ===================================================================== */
function promptModal({ heading, name='', showColor=false, accent=PALETTE[0], showEmoji=false, emoji='' }){
  return new Promise(resolve => {
    let chosen = accent;
    const ov = document.createElement('div');
    ov.className = 'modal-ov';
    ov.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(heading)}" style="--accent:${safeAccent(chosen)}">
        <h3>${esc(heading)}</h3>
        <div class="modal-fields">
          ${showEmoji ? `<input class="modal-emoji" type="text" value="${esc(emoji)}" placeholder="🙂" maxlength="2" aria-label="emoji">` : ''}
          <input class="modal-input" type="text" value="${esc(name)}" placeholder="${esc(tr('ph_name'))}" maxlength="40">
        </div>
        ${showColor ? `<div class="swatches">${PALETTE.map(p=>`<button class="sw${p===chosen?' on':''}" data-c="${p}" style="background:${p}" aria-label="color"></button>`).join('')}</div>` : ''}
        <div class="modal-actions">
          <button class="mbtn cancel">${tr('cancel')}</button>
          <button class="mbtn save">${tr('save')}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const input = ov.querySelector('.modal-input');
    const emojiInput = ov.querySelector('.modal-emoji');
    const modal = ov.querySelector('.modal');
    setTimeout(()=> input.focus(), 60);
    if(showColor){
      ov.querySelectorAll('.sw').forEach(b => b.addEventListener('click', ()=>{
        chosen = b.dataset.c;
        ov.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        modal.style.setProperty('--accent', chosen);
      }));
    }
    const onKey = e => { if(e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    const close = (val) => { document.removeEventListener('keydown', onKey); ov.remove(); resolve(val); };
    const save = () => {
      const v = input.value.trim(); if(!v){ input.focus(); return; }
      const em = emojiInput ? (emojiInput.value.trim() || '•') : undefined;
      close({ name:v, accent:chosen, emoji:em });
    };
    ov.querySelector('.cancel').addEventListener('click', ()=> close(null));
    ov.querySelector('.save').addEventListener('click', save);
    ov.addEventListener('click', e => { if(e.target === ov) close(null); });
    input.addEventListener('keydown', e => { if(e.key==='Enter') save(); });
  });
}
function confirmModal(msg, confirmLabel){
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'modal-ov';
    ov.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(msg)}">
        <p class="modal-msg">${esc(msg)}</p>
        <div class="modal-actions">
          <button class="mbtn cancel">${tr('cancel')}</button>
          <button class="mbtn save warn">${esc(confirmLabel || tr('archive'))}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const onKey = e => { if(e.key === 'Escape') close(false); };
    document.addEventListener('keydown', onKey);
    const close = (v) => { document.removeEventListener('keydown', onKey); ov.remove(); resolve(v); };
    setTimeout(()=> ov.querySelector('.cancel').focus(), 60);
    ov.querySelector('.cancel').addEventListener('click', ()=> close(false));
    ov.querySelector('.save').addEventListener('click', ()=> close(true));
    ov.addEventListener('click', e => { if(e.target === ov) close(false); });
  });
}

/* =====================================================================
   AUTH  (login / signup / reset / magic link + per-user seeding)
   ===================================================================== */
let authMode = 'login';      // 'login' | 'signup'
let currentUserId = null;    // logged-in user's uuid (also used to scope seed inserts)
let currentUserEmail = null; // logged-in user's email (gates the owner-only Stats panel)
let appLoaded = false;       // guards against reloading data on repeated auth events
// Only this account sees the Stats panel; owner_stats() also re-checks server-side.
const OWNER_EMAIL = 'rogerthatheart@gmail.com';
const isOwner = () => (currentUserEmail || '').toLowerCase() === OWNER_EMAIL;
const redirectTo = () => location.origin + location.pathname;
const gateEl = () => document.getElementById('gate');
const appEl  = () => document.querySelector('.app');

function showApp(){ gateEl().hidden = true; appEl().style.display = ''; }
function showGate(){ appEl().style.display = 'none'; gateEl().hidden = false; }
function setGateMsg(text, ok){
  const m = document.getElementById('gateMsg');
  m.textContent = text || ''; m.classList.toggle('ok', !!ok);
}
function setGateBusy(b){
  ['authSubmit','magicBtn','toggleMode','forgotBtn'].forEach(id => {
    const el = document.getElementById(id); if(el) el.disabled = b;
  });
}
const gv = (id) => (document.getElementById(id).value || '').trim();

function prettyAuthError(err){
  const msg = (err && err.message ? err.message : String(err)).toLowerCase();
  if(msg.includes('invalid login')) return tr('err_invalid');
  if(msg.includes('already registered') || msg.includes('already been registered')) return tr('err_registered');
  if(msg.includes('password') && msg.includes('6')) return tr('err_pass6');
  if(msg.includes('email') && msg.includes('confirm')) return tr('err_confirm');
  if(msg.includes('rate limit') || msg.includes('too many')) return tr('err_rate');
  return tr('err_generic');
}

// Seed a brand-new account with the starter set. No-op if the account already has tablitas.
async function ensureSeed(){
  if(state.config && state.config.length) return;
  try{
    const uid = currentUserId;
    const seed = seedSets();
    await sbPost('tablitas', seed.tablitas.map(t => ({
      id:t.id, title:t.title, accent:t.accent, sort_order:t.sort_order, archived:false, user_id:uid })));
    const subs = [];
    seed.tablitas.forEach(t => (t.subActivities||[]).forEach(s => subs.push({
      id:s.id, tablita_id:t.id, label:s.label, sort_order:s.sort_order, archived:false, user_id:uid })));
    await sbPost('sub_activities', subs);
    await sbPost('counters', seed.counters.map(c => ({
      id:c.id, label:c.label, emoji:c.emoji, accent:c.accent, sort_order:c.sort_order, archived:false, user_id:uid })));
    const [config, counters] = await Promise.all([ sbFetchConfig(), sbFetchCounters() ]);
    state.config = config; state.counters = counters;
    saveConfigLocal(); saveCountersLocal();
    pendingWelcome = true;   // brand-new account: greet once
  }catch(e){ /* leave empty — the user can still add tables manually */ }
}
// A one-time warm welcome, shown only for a just-created account (guarded so it never
// repeats). Rendered as a dismissible card at the top of the Tracker panel.
let pendingWelcome = false;
function maybeShowWelcome(){
  if(!pendingWelcome) return;
  pendingWelcome = false;
  try{ if(localStorage.getItem(LS_WELCOME)) return; }catch(e){}
  const panel = document.getElementById('panel-tracker');
  if(!panel || panel.querySelector('.welcome-card')) return;
  const card = el('div','welcome-card');
  card.innerHTML = `
    <h2>${esc(tr('welcome_title'))}</h2>
    <p>${esc(tr('welcome_body'))}</p>
    <button class="wc-btn" type="button">${esc(tr('welcome_cta'))}</button>`;
  card.querySelector('.wc-btn').addEventListener('click', ()=>{
    try{ localStorage.setItem(LS_WELCOME,'1'); }catch(e){}
    card.remove();
  });
  panel.insertBefore(card, panel.firstChild);
}

async function handleSession(s){
  const uid = (s && s.user) ? s.user.id : null;
  if(uid){
    accessToken = s.access_token;
    currentUserEmail = (s.user && s.user.email) || null;
    applyOwnerUI();
    if(uid === currentUserId && appLoaded){ return; } // already loaded this user
    currentUserId = uid;
    showApp();
    await initData();
    await ensureSeed();
    appLoaded = true;
    renderTrackerArea();
    maybeShowWelcome();
    if(state.tab === 'insights') renderInsights();
  }else{
    accessToken = SUPABASE_ANON;
    currentUserId = null; currentUserEmail = null; appLoaded = false;
    applyOwnerUI();
    if(state.tab === 'stats') switchTab('tracker');
    showGate();
  }
  document.getElementById('loader').classList.add('hide');
}

// Show/hide the owner-only Stats tab based on who's logged in.
function applyOwnerUI(){
  const tab = document.getElementById('statsTab');
  if(tab) tab.hidden = !isOwner();
}

// Aggregated, owner-only metrics. The server function re-checks the caller's
// email, so this returns nothing useful to anyone else even if they call it.
async function fetchOwnerStats(){
  const res = await fetch(REST_BASE + 'rpc/owner_stats', {
    method:'POST',
    headers:{ ...authHeaders(), 'Content-Type':'application/json' },
    body:'{}',
  });
  if(res.status === 404) return { __missing:true };
  if(!res.ok) throw new Error('stats HTTP '+res.status);
  return res.json();
}

function statCard(big, lbl){
  return `<div class="stat-card"><div class="big">${big}</div><div class="lbl">${esc(lbl)}</div></div>`;
}

async function renderStats(){
  const host = document.getElementById('stats');
  if(!host) return;
  if(!isOwner()){ host.innerHTML = ''; return; }
  host.innerHTML = `<p class="stat-sub">${esc(tr('stats_loading'))}</p>`;
  let d;
  try{ d = await fetchOwnerStats(); }
  catch(e){ host.innerHTML = `<p class="stats-note">${esc(tr('stats_err'))}</p>`; return; }
  if(!d || d.__missing || d.error === 'forbidden'){
    host.innerHTML = `<p class="stats-note">${esc(tr('stats_setup'))}</p>`; return;
  }
  const n = v => (v == null ? 0 : v);
  const wau = n(d.active_7d);
  const stickiness = wau ? Math.round(n(d.active_today) / wau * 100) : 0;
  const daily = Array.isArray(d.daily) ? d.daily : [];
  const peak = daily.reduce((m,x)=> Math.max(m, n(x.users)), 0) || 1;
  const bars = daily.map(x => {
    const h = Math.max(3, Math.round(n(x.users) / peak * 56));
    return `<div class="bar" style="height:${h}px" title="${esc(x.day)}: ${n(x.users)}"></div>`;
  }).join('');

  host.innerHTML = `
    <div class="stat-grid">
      ${statCard(n(d.active_today), tr('stats_active') + ' · ' + tr('stats_today'))}
      ${statCard(wau, tr('stats_active') + ' · ' + tr('stats_7d'))}
      ${statCard(n(d.total_users), tr('stats_total_users'))}
      ${statCard(n(d.new_7d), tr('stats_new') + ' · ' + tr('stats_7d'))}
      ${statCard(n(d.returning_7d), tr('stats_returning'))}
      ${statCard(stickiness + '%', tr('stats_stickiness'))}
    </div>
    <div class="spark-row">
      <div class="spark">${bars || ''}</div>
      <div class="lbl">${esc(tr('stats_dau'))}</div>
    </div>`;
}

async function onAuthSubmit(e){
  e.preventDefault();
  if(!sb){ setGateMsg(tr('msg_no_access')); return; }
  const email = gv('authEmail'), pass = gv('authPass');
  if(!email){ setGateMsg(tr('msg_need_email')); return; }
  if(!pass){ setGateMsg(tr('msg_need_pass')); return; }
  setGateBusy(true); setGateMsg(tr('msg_entering'), true);
  try{
    if(authMode === 'login'){
      const { error } = await sb.auth.signInWithPassword({ email, password:pass });
      if(error) throw error;
    }else{
      const { data, error } = await sb.auth.signUp({ email, password:pass, options:{ emailRedirectTo:redirectTo() } });
      if(error) throw error;
      if(data && data.user && !data.session){
        setGateMsg(tr('msg_account_created'), true);
        setGateBusy(false); return;
      }
    }
    // onAuthStateChange → handleSession swaps to the app.
  }catch(err){ setGateMsg(prettyAuthError(err)); setGateBusy(false); }
}

async function onMagicLink(){
  const email = gv('authEmail');
  if(!email){ setGateMsg(tr('msg_need_email_first')); return; }
  setGateBusy(true); setGateMsg('');
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo:redirectTo() } });
  setGateBusy(false);
  setGateMsg(error ? prettyAuthError(error) : tr('msg_magic_sent'), !error);
}

async function onForgot(){
  const email = gv('authEmail');
  if(!email){ setGateMsg(tr('msg_need_email_first')); return; }
  setGateBusy(true); setGateMsg('');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo:redirectTo() });
  setGateBusy(false);
  setGateMsg(error ? prettyAuthError(error) : tr('msg_reset_sent'), !error);
}

async function onGoogle(){
  setGateBusy(true); setGateMsg('');
  // Redirects the page to Google; on return, detectSessionInUrl + onAuthStateChange sign in.
  const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:redirectTo() } });
  if(error){ setGateBusy(false); setGateMsg(prettyAuthError(error)); }
}

function applyAuthModeTexts(){
  const login = authMode === 'login';
  document.getElementById('authSubmit').textContent = login ? tr('login_submit') : tr('signup_submit');
  document.getElementById('toggleMode').textContent = login ? tr('to_signup') : tr('to_login');
  document.getElementById('gateTag').textContent = login ? tr('tag_login') : tr('tag_signup');
  document.getElementById('authPass').setAttribute('autocomplete', login ? 'current-password' : 'new-password');
}

function toggleAuthMode(){
  authMode = (authMode === 'login') ? 'signup' : 'login';
  applyAuthModeTexts();
  setGateMsg('');
}

async function onLogout(){
  if(!await confirmModal(tr('confirm_logout'), tr('logout_icon'))) return;
  await sb.auth.signOut(); // onAuthStateChange → handleSession shows the gate
}

function bindAuthUI(){
  document.getElementById('authForm').addEventListener('submit', onAuthSubmit);
  document.getElementById('googleBtn').addEventListener('click', onGoogle);
  document.getElementById('magicBtn').addEventListener('click', onMagicLink);
  document.getElementById('forgotBtn').addEventListener('click', onForgot);
  document.getElementById('toggleMode').addEventListener('click', toggleAuthMode);
  document.getElementById('logoutBtn').addEventListener('click', onLogout);
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot(){
  appEl().style.display = 'none'; // avoid a flash of the app before we know the session
  bindUI();
  bindAuthUI();
  bindLangToggles();
  applyLang();          // localize all static text + set the toggle to the chosen/guessed language
  // Load the auth library (with backup CDN) and create the client.
  if(await loadSupabaseLib()){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce' },
    });
  }
  // If it still failed, show the gate with a clear message instead of silently
  // doing nothing when the user taps a button.
  if(!sb){
    document.getElementById('loader').classList.add('hide');
    showGate();
    setGateMsg(tr('msg_load_failed'));
    return;
  }
  // Later sign-in/out events (incl. magic-link / reset redirects) swap views.
  sb.auth.onAuthStateChange((event, s) => {
    if(event === 'INITIAL_SESSION') return;                 // handled by getSession below
    if(event === 'TOKEN_REFRESHED'){ if(s) accessToken = s.access_token; return; }
    handleSession(s);
  });
  const { data:{ session } } = await sb.auth.getSession();
  await handleSession(session);
}
boot();
// Offline shell + installability (PWA). Never blocks the app if it fails.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
